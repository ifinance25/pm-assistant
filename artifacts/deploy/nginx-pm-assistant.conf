# Только localhost: публичного DNS у PM Assistant нет.
# Открыть с Mac: SSH-туннель на 127.0.0.1:5173 (см. README).
server {
    listen 127.0.0.1:5173 default_server;
    server_name _;
    root /opt/pm-assistant/app/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
